name: Feature request
description: Propose a focused product or workflow improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Audio, compatibility, or provenance constraints
      description: Note real-time safety, state compatibility, platform, licensing, or asset boundaries.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

