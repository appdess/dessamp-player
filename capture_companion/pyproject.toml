[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dessmetal-capture"
version = "0.1.0"
description = "Local-first conditioned-amplifier capture, training, and diagnostic tooling for DessAmp"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "sounddevice>=0.5,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
dessmetal-capture = "dessmetal_capture.__main__:main"
dessmetal-trainer = "dessmetal_capture.__main__:main"
dessmetal-player = "dessmetal_player.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dessmetal_capture = ["static/*"]
dessmetal_player = ["static/*"]
